:root[data-theme="dark"]{--bg:#1c1a22;--surface:#26232e;--fg:#e9e5ee;--muted:#a39dae;--line:rgba(233,229,238,.13);--accent:#b3a6cc;--accent2:#7d70a0;--accent-fg:#1c1a22;--soft:#302c3a;--good:#a5bca8;--low:#93a6ba;--mink:#d3c9e3;--mpaper:#2d2938;--mvisor:#15131a;--mglow:#b3a6cc;--mwater:#8478a6;--mlatte:#cfc6dc;color-scheme:dark}
*{box-sizing:border-box}

.hero .kicker{color:#fffaf1;opacity:.85}
.hero h1{font-size:1.9rem;margin:6px 0 4px}

.hero p.s{font-family:var(--serif);font-size:1.1rem;line-height:1.75;margin:0}
.hero .shape{display:inline-block;margin-top:14px;border:1px solid currentColor;border-radius:999px;padding:0 12px;font-size:.82rem;opacity:.95}
.hero .figin{background:rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;margin:14px 0 4px;text-align:left}.hero .figin h4{font-size:.86rem;opacity:.85;margin:0 0 4px;font-weight:600;letter-spacing:.04em}.hero .figin .fh span{color:inherit;opacity:.8}.hero .figin .figt{margin:2px 0;font-size:1rem;color:inherit}.hero .figin .figc{margin:4px 0 0;font-size:.92rem;opacity:.95;color:inherit;background:none;border:0;padding:0}
.radar{width:100%;max-width:460px;display:block;margin:0 auto}
.radar .tr2{fill:var(--muted)}
.radar text{font-family:var(--sans);fill:var(--fg)}
.row{display:grid;grid-template-columns:6.4em 1fr 2.6em;gap:8px;align-items:center;font-size:.92rem;margin:7px 0}
.row .tr{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}.row .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--mlatte),var(--accent))}
.row.lo .tr i{background:var(--low)}.row.mid .tr i{background:var(--muted)}
.row.na .tr{background:transparent;border:1px dashed var(--line)}.lv.na{color:var(--muted);border:1px dashed var(--line)}
.tag.off{opacity:.55;border-style:dashed}
.lv{font-size:.78rem;font-weight:700;text-align:center;border-radius:999px;padding:0 4px}
.lv.hi{background:var(--accent);color:var(--accent-fg)}.lv.mid{border:1px solid var(--line);color:var(--muted)}.lv.lo{background:var(--low);color:var(--bg)}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:0 9px;color:var(--muted);margin:2px 4px 2px 0}

.tens{display:grid;grid-template-columns:5.2em 1fr 5.2em;gap:8px;align-items:center;font-size:.85rem;margin:12px 0 2px}

.tens .tk i{position:absolute;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-left:-9px}
.tens span:last-child{text-align:right}
.q{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:8px 0;font-size:.92rem}.q .o{color:var(--muted);font-size:.8rem}
.fg p{margin:8px 0}.fg b{display:block;font-size:.85rem;color:var(--muted);margin-bottom:2px}.fg .src{font-size:.8rem;color:var(--muted)}
.bh{margin:18px 0 4px;font-size:1rem}
.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 0;background:var(--bg);margin-bottom:8px}
.jump a{flex:1;white-space:nowrap;text-align:center;padding:7px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:.9rem;cursor:pointer;color:var(--fg)}
#t1,#t2,#t3,#t4,#t5{scroll-margin-top:56px}
.fb{margin:12px 0}.fn b{font-size:1rem}.fn em{font-style:normal;font-size:.75rem;color:var(--muted);margin-left:8px;padding:1px 7px;border-radius:999px;background:var(--soft)}
.fb .tr{display:block;height:9px;border-radius:5px;background:var(--soft);margin:5px 0 3px;overflow:hidden}.fb .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.ft{font-size:.82rem;color:var(--fg);margin-top:4px;padding:6px 8px;border-radius:8px;background:var(--soft)}
.fw{font-size:.85rem;color:var(--muted)}
.jb{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.bd{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.mls .ml{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}.mls .ml b{flex:none;width:5.5em}.mls .ml span{color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}.mls .ml i{font-style:normal;white-space:nowrap}.mls .ml.hi b{color:var(--accent)}
.fh{display:flex;align-items:baseline;gap:10px;margin:2px 0}.fh b{font-size:1.15rem}.fh span{color:var(--muted);font-size:.9rem}
.who{font-size:.9rem;color:var(--muted);margin:2px 0 6px}
.pts{margin:8px 0;padding-left:1.1em}.pts li{margin:6px 0;line-height:1.55}
.cmp{display:grid;gap:6px;margin:10px 0;padding:10px;border-radius:10px;background:var(--soft)}.cmp div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.cmp em{font-style:normal;font-size:.8rem;color:var(--muted);width:100%}.cmp i{font-style:normal;font-size:.85rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}.cmp i.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.src{font-size:.78rem;color:var(--muted)}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:.82rem;color:var(--muted);margin:10px 0}.lg b{display:inline-block;width:1.6em;color:var(--fg)}
.say{font-size:.92rem;color:var(--muted);margin:2px 0 8px}
.cl{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;font-size:.92rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}.btns .ghost{margin:0}
.out{white-space:pre-wrap}
details{margin:14px 0}summary{cursor:pointer;color:var(--muted);padding:6px 0}
#brand{display:flex;align-items:center;gap:10px;padding:6px 0 12px}#brand .nm{font-weight:800;letter-spacing:.06em;font-size:.95rem}#brand .tg{margin-left:auto;font-size:.68rem;letter-spacing:.16em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px}

.mugbox{display:flex;justify-content:center;margin:6px 0 2px}.mugbox svg{width:clamp(150px,44vw,190px);height:auto;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(135,122,160,.35))}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.pills span{font-size:.78rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 12px;color:var(--muted)}
.tc{text-align:center}.hl{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.loading{position:fixed;inset:0;z-index:1000;background:rgba(244,242,245,.94);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s ease}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .loading{background:rgba(28,26,34,.94)}}:root[data-theme="dark"] .loading{background:rgba(28,26,34,.94)}
.loading.show{opacity:1;pointer-events:auto}.loading svg{width:160px;height:160px;animation:bounce 1.2s ease-in-out infinite}
.pop{position:fixed;inset:0;z-index:2000;background:rgba(40,34,52,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.pbox{background:var(--surface);border-radius:20px;padding:14px;max-width:420px;width:100%;max-height:100%;overflow:auto;text-align:center;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.pbox img{display:block;width:100%;height:auto;border-radius:12px;-webkit-touch-callout:default;user-select:auto}
.pbox .ph{font-size:.88rem;color:var(--muted);margin:10px 0 6px}.pbox .pb{display:flex;gap:8px;justify-content:center}.pbox .pb .cta,.pbox .pb .ghost{margin:6px 0 0;flex:1}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (max-width:520px){h1{font-size:1.75rem}.hero h1{font-size:1.6rem}}

.scs{display:grid;gap:8px;margin-top:6px}.sc{display:grid;grid-template-columns:6.2em 1fr;gap:8px;font-size:.95rem;line-height:1.6}.sc b{font-weight:700;white-space:nowrap}
.hero .sc{color:#fffaf1}.hero .sc span{opacity:.96}.card .sc{color:var(--fg)}
.jc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--surface)}.jc p{margin:6px 0 0;font-size:.92rem;line-height:1.6}
.jh{display:flex;align-items:center;gap:8px;justify-content:space-between}.jh b{font-size:1.02rem}.tier{font-style:normal;font-size:.78rem;padding:1px 9px;border-radius:999px;background:var(--soft);color:var(--accent2);white-space:nowrap}
.lb{display:inline-block;font-size:.76rem;font-weight:700;color:var(--accent2);margin-right:8px}

/* ===== 视觉分区：颜色按“场景/层级”分，字多的地方用色块托住 ===== */
:root{--cw:#7f8fb5;--cl:#7fa088;--cr:#bf9f78;--cq:#c28b9b}

.card h3{display:flex;align-items:center;gap:8px}.card h3:before{content:"";flex:none;width:5px;height:1.05em;border-radius:3px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.sc{--c:var(--accent);padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border-left:4px solid var(--c);align-items:start}

.jc{--c:var(--accent2);border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 6%,var(--surface))}

.fb{border-left:4px solid var(--cl);padding:4px 0 4px 10px;margin:12px 0}.fb.hd{border-left-color:var(--cr)}

.hero{background:linear-gradient(150deg,#877aa0 0%,#6f6389 100%)}

const PAIR={"AB": {"h": "听到新说法，能很快拆开、对着看明白，再用一句话讲给别人。", "w": "同事转来一篇很火的文章，你半小时后回了三行：它说了什么、哪一步没说清、值不值得跟。", "l": "学新东西你不背定义，先问它想解决什么，再对着旧办法看差在哪，记住的就不容易忘。爱把事情想清楚的人，两种智力平均都略高：一种是遇到没见过的新问题，能现场想办法解决的能力；一种是靠学习和经验攒下来的知识和技能，比如词汇、常识（Schweitzer 等, 2025）。", "r": "刷到一个看不懂的说法，你顺着查到源头，中途常常拐进别的坑里，一下午就没了。", "q": "TA 说不清自己为什么烦，你问了几句，把它分成“这件事”和“那口气”，TA 才发现真正在意的是后者。", "y": "AI 说得头头是道，却不一定对，这是眼下最让人头疼的事之一。能追问、会拆开检查的人，就是把关的那一个。"}, "AC": {"h": "看到奇怪的东西，会追问它为什么长这样，还能马上想出换个样子会怎样。", "w": "别人照着模板做，你先问这块为什么一直这么做，问完顺手给了一个没人试过的版本。对自己“能搞出新东西”有信心的人，创造力表现更好（Haase 等, 2018）。一起用 AI 做的作品，大家做出来的东西越来越像，有自己味道的想法更难被抹平（Holzner 等, 2025）。", "l": "你学东西爱跑题，看着看着跑到另一个领域，回来反而想出了更好的用法。爱追问、想弄明白的人，智力测验分平均略高（Anglim 等, 2022）。", "r": "路上看到一个奇怪的招牌，你会想它是谁起的名，顺便想出三个更好玩的。艺术家在“对新体验开放”这项性格上，平均比非艺术家更高。这里的“开放”不是外向、放得开，而是愿意接触新鲜事和新想法、爱想象（Feist, 1998）。", "q": "TA 随口说过的一个愿望，你记下来，做成了 TA 没想到的样子。", "y": "AI 生成的东西越来越多，也越来越像。能追问出“为什么有意思”、再换个角度的人，能让产出有方向。"}, "AD": {"h": "了解到够用就果断往下走，不会一直停在“再查查”里。", "w": "一个方案你连问三句，关键那条清楚了就说“够了，开始”，不再往下查。一项毕业生追踪发现，爱挑“最好的那一个”的人起薪更高，但对工作更不满意（Iyengar 等, 2006），这只是一项研究的结果。", "l": "学新技能你先弄明白最该练哪一块，确认完就开练，不等把教程看完。爱追问、想弄明白的人，智力测验分平均略高（Anglim 等, 2022）。", "r": "想去哪玩，你刷十分钟攻略，看到一条关键信息就订下来，之后不再比价。长期犹豫不决的人，往往也更容易焦虑、情绪起伏大，和情绪稳不稳联系最紧（Di Fabio 等, 2013）。所以定了就不回头，本身就是本事。", "q": "TA 犹豫不定，你问两句就说“按这个来”，TA 事后常说幸好那天定了。", "y": "信息越来越多，反而更需要有人说“够了，就这样”。你边了解边下决定，能把 AI 的信息变成行动。"}, "AE": {"h": "能听出别人话里压着的那层意思，再问到最关键的那一句。", "w": "会后大家在聊方案，你一个人走去问那位全程没出声的同事：“刚才你是不是有别的看法？”在助人类工作里，共情高的人更不容易被工作掏空心力，也不容易对服务对象变得麻木、爱答不理，成就感还更高（Martingano 等, 2026）。", "l": "你的笔记里常写着“他当时在担心什么”，所以你比别人更早看懂分歧在哪。爱追问、想弄明白的人，智力测验分平均略高（Anglim 等, 2022）。", "r": "看剧时你会停下来想那个配角的处境，朋友说你想太多，你觉得这正是好看的地方。", "q": "TA 嘴上说“随便”，你听出那点犹豫，换个问法再问一次，TA 才说了实话。能读准伴侣心情的人，感情满意度平均略高（Sened 等, 2017）。", "y": "AI 越来越会写得体的话，对方压在语气里的情绪它却读不出来。你好奇又会听，正好补上人和 AI 之间缺的这一环。"}, "AF": {"h": "两个人僵住的时候，能问出一句对方没想到的话，让气氛松下来。", "w": "两个人在会上谁也不让谁，你私下各问一句“你最担心的是什么”，下次他们竟坐到了一起。带得动人的你，社交和表达能力往往也很出众（Judge 等, 2002）。大模型的说服效果已经和真人差不多（Hölbling 等, 2025），让人愿意一起往前走才是你的优势。", "l": "讨论冷场的时候，你问一个别人没想过的问题，大家就都有话说了。爱追问、想弄明白的人，智力测验分平均略高（Anglim 等, 2022）。", "r": "饭桌上有人被晾着，你随口问起他熟悉的事，他讲了半小时，大家听得入神。", "q": "TA 和家里闹别扭，你先问清两边各在怕什么，再替 TA 想了一句好开口的话。", "y": "AI 能把各方立场写得清清楚楚，却没法让僵住的人愿意再谈一次。你好奇又会协调，能把 AI 整理的信息变成大家都接受的共识。"}, "AG": {"h": "答应过要弄清楚的事，没人催也会一直查到有结果。", "w": "一个存疑的数字，别人说“差不多就行”，你追到原始出处核对完，才说“可以了”。这里的尽责不是爱操心，而是做事靠谱、有条理、说到做到。尽责的人在几乎所有职业结果上都做得更好（Wilmot & Ones, 2019）。", "l": "你有一摞没读完的资料，别人早忘了，你却按自己定的节奏一本本收尾。爱追问、想弄明白的人，智力测验分平均略高（Anglim 等, 2022）。", "r": "休息日你还惦记着没弄清的事，翻了一小时资料，终于笑着合上电脑。", "q": "你答应过“帮 TA 查清那件事”，三天后发去一份整理好的结果，TA 自己都快忘了问过。", "y": "AI 常给出看似合理却可能出错的答案，现在最缺的是肯核实到底的人。你追根究底又不撂挑子，能把 AI 的结果查到可信。"}, "AH": {"h": "好奇一个东西，就忍不住拆开或做一个试试，手上跑通了才算数。", "w": "新工具刚上线，你已经拿手头真实的活跑了一遍，回来说“这步好用，这步别碰”。习惯不等安排，自己先动手改变现状的人，任务表现略好（Zhang 等, 2022）。", "l": "看不懂的原理，你搭个最小的例子跑一遍，跑通了比看十遍讲解都清楚。爱追问、想弄明白的人，智力测验分平均略高（Anglim 等, 2022）。", "r": "家里东西坏了，你第一反应是拆开看看里面长什么样，修不修得好另说。", "q": "TA 提过一句想要的小东西，你查了做法，周末真的动手做了出来。", "y": "AI 能讲清原理，东西跑不跑得通，还得亲手试才知道。你好奇又动手，能很快把 AI 的想法变成真正能用的东西。"}, "AI": {"h": "好奇心来自自己，不跟热搜，一个小问题能钻进去好几天。", "w": "大家都在追热点，你却在做一件看似没用的小事，因为那是你真正想知道的。出于自己想做而做的人，表现平均更好，要求质量的任务里更明显（Cerasoli 等, 2014）。", "l": "你的书单上有几本和考试、升职都没关系的书，却是你读得最慢最久的。爱追问、想弄明白的人，智力测验分平均略高（Anglim 等, 2022）。", "r": "没人安排的下午，你沿着一个冷门问题一路查下去，没人让你查，你自己停不下来。", "q": "TA 问你想要什么礼物，你想了很久，说：“我想听你讲讲最近在想的事。”", "y": "AI 擅长顺着热点走，大家做出来的东西也越来越像。你的好奇来自自己想知道，用 AI 能挖得比别人更深、更不一样。"}, "BC": {"h": "脑子里一条线在拆“事情怎么运转”，另一条线在想“换掉一块会怎样”。", "w": "流程卡住时，你先画出它现在怎么跑，再把其中一环换掉，问题就绕过去了。对自己“能搞出新东西”有信心的人，创造力表现更好（Haase 等, 2018）。一起用 AI 做的作品，大家做出来的东西越来越像，有自己味道的想法更难被抹平（Holzner 等, 2025）。", "l": "学新东西你先搭一个自己的框架，再改成只有自己看得懂的版本，记得特别牢。爱把事情想清楚的人，两种智力平均都略高：一种是遇到没见过的新问题，能现场想办法解决的能力；一种是靠学习和经验攒下来的知识和技能，比如词汇、常识（Schweitzer 等, 2025）。", "r": "玩游戏你爱研究机制，摸清之后就想办法用一种别人没用过的打法通关。艺术家在“对新体验开放”这项性格上，平均比非艺术家更高。这里的“开放”不是外向、放得开，而是愿意接触新鲜事和新想法、爱想象（Feist, 1998）。", "q": "吵完架你把事情理成一二三，然后写了张小纸条：“以后我们换个方式聊。”", "y": "AI 能拆也能发散，把两件事连起来、判断哪种做法真的行得通，还得有人来。你既会拆结构又会换玩法，正好做这一步。"}, "BD": {"h": "做决定前把利弊算得清清楚楚，真到下决定那一刻又快又稳。", "w": "你把三个方案的代价摆成一张表，看完只用一分钟就说“选第二个，这条我们输不起”。一项毕业生追踪发现，爱挑“最好的那一个”的人起薪更高，但对工作更不满意（Iyengar 等, 2006），这只是一项研究的结果。", "l": "复习时你先算哪部分最能提分，然后砍掉其余的，砍得干脆。爱把事情想清楚的人，两种智力平均都略高：一种是遇到没见过的新问题，能现场想办法解决的能力；一种是靠学习和经验攒下来的知识和技能，比如词汇、常识（Schweitzer 等, 2025）。", "r": "买大件你列好参数就下单，朋友还在比价，你已经在用了。长期犹豫不决的人，往往也更容易焦虑、情绪起伏大，和情绪稳不稳联系最紧（Di Fabio 等, 2013）。所以定了就不回头，本身就是本事。", "q": "TA 两难时，你把两条路的后果都说清楚，再说“要我选我选这条”，TA 心里就踏实了。", "y": "AI 能列出所有优缺点，最后谁来拿主意、谁为结果负责，仍然只能是人。你拆得清又下得了决心，能在信息不全时把事定下来。"}, "BE": {"h": "听人倾诉时，既接得住情绪，又能把事情理出条理，说出他自己没理清的那一句。", "w": "客户说了一堆不满，你听完回一句“您最在意的其实是交付时间，对吗”，对方语气就软了。在助人类工作里，共情高的人更不容易被工作掏空心力，也不容易对服务对象变得麻木、爱答不理，成就感还更高（Martingano 等, 2026）。", "l": "同学讲不明白的地方，你听出他卡在哪一步，再从那一步开始讲。爱把事情想清楚的人，两种智力平均都略高：一种是遇到没见过的新问题，能现场想办法解决的能力；一种是靠学习和经验攒下来的知识和技能，比如词汇、常识（Schweitzer 等, 2025）。", "r": "心里乱的时候你会写下来，分成“我能做的”和“只能等的”，写完就睡得着了。", "q": "TA 一股脑说了很多，你帮 TA 理成几件事，TA 说“原来我烦的只有第二件”。能读准伴侣心情的人，感情满意度平均略高（Sened 等, 2017）。", "y": "AI 能把事情拆成条目，却分不清对方这时候是要被听见，还是要被理清。你懂人又会拆，知道什么时候该听、什么时候该拆。"}, "BF": {"h": "争论时能把大家的话梳成“哪几点一致、哪一点不同”，气就消了一半。", "w": "甲方的要求前后对不上，你把它列成“必须有、可以商量、做不到”三栏发过去，对方回了一句“就按这个来”。带得动人的你，社交和表达能力往往也很出众（Judge 等, 2002）。大模型的说服效果已经和真人差不多（Hölbling 等, 2025），让人愿意一起往前走才是你的优势。", "l": "一门课你听完就整理出一张图，班里传开了，连没来上课的人都来找你要。爱把事情想清楚的人，两种智力平均都略高：一种是遇到没见过的新问题，能现场想办法解决的能力；一种是靠学习和经验攒下来的知识和技能，比如词汇、常识（Schweitzer 等, 2025）。", "r": "想买个大件，你列了三家的价格、保修和退货规则发在群里，朋友照着你那张表下了单。", "q": "TA 讲了一大段烦心事，你帮 TA 理成“哪些能改、哪些只能等”，TA 说“这样我就知道先做什么了”。", "y": "AI 能总结各方观点，却没法让观点不同的人愿意坐下来。你把分歧拆清楚再说服，能让人和人、团队和团队真的谈得拢。"}, "BG": {"h": "一件复杂的事压下来，先拆成清单一项项做，做不完的会写明还差什么。", "w": "一摊乱事压下来，你先拆成清单，谁做哪条写得清清楚楚，最后没人认领的那几条你自己收了。这里的尽责不是爱操心，而是做事靠谱、有条理、说到做到。尽责的人在几乎所有职业结果上都做得更好（Wilmot & Ones, 2019）。", "l": "你的复习计划细到每天几页，落下的那几天会补回来，不骗自己。爱把事情想清楚的人，两种智力平均都略高：一种是遇到没见过的新问题，能现场想办法解决的能力；一种是靠学习和经验攒下来的知识和技能，比如词汇、常识（Schweitzer 等, 2025）。", "r": "搬家、报税这种麻烦事，你列个表一项项做完，做完那天心里特别踏实。", "q": "答应 TA 的事你会写进待办，拖久了也会说明还差什么、什么时候给。", "y": "AI 能把大任务拆成步骤，每一步有没有做完、出错谁来收，还得人盯到底。现在大家最想知道“谁来负责”，你拆得清也扛得住。"}, "BH": {"h": "拿到新东西一边动手试，一边在脑子里画结构，卡住时能说出问题大概在哪一步。", "w": "机器出了问题，你边拆边说“大概卡在第三步”，一试，果然。习惯不等安排，自己先动手改变现状的人，任务表现略好（Zhang 等, 2022）。", "l": "学不会的东西，你照着做一个最小的版本，哪一步做不下去，哪一步就是你没懂的。爱把事情想清楚的人，两种智力平均都略高：一种是遇到没见过的新问题，能现场想办法解决的能力；一种是靠学习和经验攒下来的知识和技能，比如词汇、常识（Schweitzer 等, 2025）。", "r": "家里的收纳你重排过好几轮，每轮都比上一轮顺手一点。", "q": "TA 说某个东西不好用，你当场拆开看，找出是哪个零件的问题。", "y": "AI 能写出步骤，真正卡在哪一步，常要动手才发现。你边做边拆结构，能很快定位问题，让 AI 写的东西真正跑起来。"}, "BI": {"h": "大家在讨论选哪个时，你会拆开选项，问“哪一项是我真正在乎的”。", "w": "大家争着选哪个方案，你问了一句“我们到底想要什么”，讨论换了方向。出于自己想做而做的人，表现平均更好，要求质量的任务里更明显（Cerasoli 等, 2014）。", "l": "你会把学到的东西分成“对我有用”和“只是听着厉害”，后者再热也不碰。爱把事情想清楚的人，两种智力平均都略高：一种是遇到没见过的新问题，能现场想办法解决的能力；一种是靠学习和经验攒下来的知识和技能，比如词汇、常识（Schweitzer 等, 2025）。", "r": "刷手机刷到一半你会停下来问自己“这是在放松还是在躲事”，然后关掉。", "q": "TA 替你安排得很周到，你会说出自己真正想要的那个，而不是客气地接受。", "y": "AI 能给出很多选项，哪一项是我真正在乎的，只有自己知道。你拆开比较再按自己的方向选，不容易被工具带着跑。"}, "CD": {"h": "脑子里冒出一堆主意，几秒内就能挑出最值得试的那一个。", "w": "脑暴时你一口气冒出十几个点子，然后只留一个，说：“就做这个。”对自己“能搞出新东西”有信心的人，创造力表现更好（Haase 等, 2018）。一起用 AI 做的作品，大家做出来的东西越来越像，有自己味道的想法更难被抹平（Holzner 等, 2025）。", "l": "一道题你先试三种完全不同的解法，试到第二种就知道哪种走得通，剩下的不再碰。", "r": "你的收藏夹里存着一堆想试的新东西，真动手的永远只有一两个，不做的那些你也说得出为什么。艺术家在“对新体验开放”这项性格上，平均比非艺术家更高。这里的“开放”不是外向、放得开，而是愿意接触新鲜事和新想法、爱想象（Feist, 1998）。", "q": "TA 说“纪念日随便过”，你想了几个惊喜，挑最特别的那个，直接订了。", "y": "AI 一口气能给上百个点子，难的是挑一个、愿意试。你想得多又选得快，能把 AI 的“很多”变成“先做这个”。"}, "CE": {"h": "想点子时总想着“对方看到会是什么表情”，所以你的主意让人觉得被记住。", "w": "做方案时你会想“对方看到第一眼是什么感觉”，所以你的版本总让人更舒服。在助人类工作里，共情高的人更不容易被工作掏空心力，也不容易对服务对象变得麻木、爱答不理，成就感还更高（Martingano 等, 2026）。", "l": "讲给别人听之前，你会换成他熟悉的例子，所以听你讲的人学得快。", "r": "你送的东西常常不贵，却正好是对方提过一次的。艺术家在“对新体验开放”这项性格上，平均比非艺术家更高。这里的“开放”不是外向、放得开，而是愿意接触新鲜事和新想法、爱想象（Feist, 1998）。", "q": "TA 低落的时候，你用一个只有你们俩懂的玩笑把气氛转了过来。能读准伴侣心情的人，感情满意度平均略高（Sened 等, 2017）。", "y": "AI 能写出漂亮的创意，对方看到会是什么感觉，要懂人才想得到。人们更愿意和人打交道，你的点子带着对人的体贴。"}, "CF": {"h": "想出的点子，自带“怎么讲别人才愿意跟着试”的那一半。", "w": "你的提案里永远有一个让人眼前一亮的点，再加一句“它对你有什么好处”。带得动人的你，社交和表达能力往往也很出众（Judge 等, 2002）。大模型的说服效果已经和真人差不多（Hölbling 等, 2025），让人愿意一起往前走才是你的优势。", "l": "同一个知识点你能给三种说法，总有一种让对方点头。", "r": "朋友出去玩懒得计划，你随口说了个有意思的玩法，大家立刻都想去。艺术家在“对新体验开放”这项性格上，平均比非艺术家更高。这里的“开放”不是外向、放得开，而是愿意接触新鲜事和新想法、爱想象（Feist, 1998）。", "q": "TA 不想出门，你把要做的事讲成一件好玩的事，TA 就起来了。", "y": "AI 能写出创意，让别人愿意跟着试，靠的是讲法和信任。你的点子自带说服力，能把想法变成大家一起做的事。"}, "CG": {"h": "点子很多，答应过要做的那个，做到一半不好玩了也会改着做完。", "w": "点子落地到最没意思的那一段，你没跑，把它做完了，所以别人愿意再把事交给你。对自己“能搞出新东西”有信心的人，创造力表现更好（Haase 等, 2018）。一起用 AI 做的作品，大家做出来的东西越来越像，有自己味道的想法更难被抹平（Holzner 等, 2025）。", "l": "你开过好几个坑，但每个学期总有一个被你认真填完。毅力，也就是长期咬住目标不放，对成绩有帮助（Credé 等, 2017）。", "r": "有个小东西你做了很久，热情过去了还在改，改到自己满意为止。艺术家在“对新体验开放”这项性格上，平均比非艺术家更高。这里的“开放”不是外向、放得开，而是愿意接触新鲜事和新想法、爱想象（Feist, 1998）。", "q": "答应给 TA 做的那件小事，做起来远比想的麻烦，你还是做完了。", "y": "AI 让出点子变得很容易，一路做完反而更稀缺。你有想法也肯做到底，正是现在最缺的那种人。"}, "CH": {"h": "点子不到一天就能变成手边一个粗糙的小成品，不做出来就觉得没成立。", "w": "开会讲不清的时候，你直接做个粗糙的小样放桌上，大家一看就懂了。对自己“能搞出新东西”有信心的人，创造力表现更好（Haase 等, 2018）。一起用 AI 做的作品，大家做出来的东西越来越像，有自己味道的想法更难被抹平（Holzner 等, 2025）。", "l": "学新工具你不看完教程，边想边做，第一个成品常常当天就出来。", "r": "你的相册里有个当晚做出来的小玩意，名字叫“先跑起来”。艺术家在“对新体验开放”这项性格上，平均比非艺术家更高。这里的“开放”不是外向、放得开，而是愿意接触新鲜事和新想法、爱想象（Feist, 1998）。", "q": "TA 随口提的一个想法，你当晚就做了个丑丑的版本给 TA 看，TA 笑了很久。", "y": "AI 能写想法，想法变成能拿在手里的东西，还要人动手。你想到就做出小样，能让大家先看到、再讨论。"}, "CI": {"h": "点子来自“我自己真想看到的东西”，别人觉得怪的，反而是你最舍不得的。", "w": "大家都在做稳妥的方案，你却坚持做了那个“我自己真想看到”的版本。对自己“能搞出新东西”有信心的人，创造力表现更好（Haase 等, 2018）。一起用 AI 做的作品，大家做出来的东西越来越像，有自己味道的想法更难被抹平（Holzner 等, 2025）。", "l": "你学东西不先问有没有用，只看它有没有打动你，所以能学得比别人久。", "r": "你做的小东西只给自己看，不发朋友圈，却做得很开心。艺术家在“对新体验开放”这项性格上，平均比非艺术家更高。这里的“开放”不是外向、放得开，而是愿意接触新鲜事和新想法、爱想象（Feist, 1998）。", "q": "TA 问“为什么送这个”，你说：“因为这是我们之间才有的东西。”", "y": "AI 容易给出大众喜欢的东西，大家做出来的也越来越像。你的点子带着个人风格，在一片相似里最容易被认出来。"}, "DE": {"h": "下决定之前，会先感觉一下在场每个人的感受，所以你的决定最少人不舒服。", "w": "定方案前你会先看一圈谁最为难，定完专门跟那个人说一句，事情就没人卡着。在助人类工作里，共情高的人更不容易被工作掏空心力，也不容易对服务对象变得麻木、爱答不理，成就感还更高（Martingano 等, 2026）。", "l": "一起学的人跟不上，你会当场调整节奏，把要做的减到他能完成。", "r": "朋友里总是你拿主意去哪，但你记得谁不能吃辣、谁得早走。长期犹豫不决的人，往往也更容易焦虑、情绪起伏大，和情绪稳不稳联系最紧（Di Fabio 等, 2013）。所以定了就不回头，本身就是本事。", "q": "TA 说不出想去哪，你替 TA 定了，定的是 TA 上次提过的那家。能读准伴侣心情的人，感情满意度平均略高（Sened 等, 2017）。", "y": "AI 能给方案，下决定时顾及在场的人，只有懂人的人做得好。人们更愿意和人打交道，你下的决定让人信得过。"}, "DF": {"h": "大家争到僵住时，你说一句“那就这样吧”，大家居然都点头了。", "w": "争到僵住时你说一句“那就这样吧”，还顺手给每个人留了台阶，大家居然都点头了。带得动人的你，社交和表达能力往往也很出众（Judge 等, 2002）。大模型的说服效果已经和真人差不多（Hölbling 等, 2025），让人愿意一起往前走才是你的优势。", "l": "报名截止前一小时，你定了要报的那门课，还顺手劝动了两个犹豫的同学一起报。", "r": "打球组队你很快定好谁打哪个位置，有人不服，你两句话就说服了他。长期犹豫不决的人，往往也更容易焦虑、情绪起伏大，和情绪稳不稳联系最紧（Di Fabio 等, 2013）。所以定了就不回头，本身就是本事。", "q": "两个人闹别扭，你先定下“今晚先不争这个”，再把话讲到 TA 听得进去。", "y": "AI 能列出方案，僵持时有人说“就这样”，大家还愿意点头，靠的是信任。你能把一屋子人的意见收成一个决定。"}, "DG": {"h": "定下的事不反悔，中途不顺也认下来改着往下走，不推翻重来。", "w": "你定的方向中途出了问题，你没推翻重来，认下来改着往下走，最后交了出去。一项毕业生追踪发现，爱挑“最好的那一个”的人起薪更高，但对工作更不满意（Iyengar 等, 2006），这只是一项研究的结果。", "l": "定了的学习计划你很少改，哪怕某一周很难，也只是放慢，不取消。毅力，也就是长期咬住目标不放，对成绩有帮助（Credé 等, 2017）。", "r": "你决定的事会写下来，比如每周去一次球场，下雨也去。长期犹豫不决的人，往往也更容易焦虑、情绪起伏大，和情绪稳不稳联系最紧（Di Fabio 等, 2013）。所以定了就不回头，本身就是本事。", "q": "吵完架，TA 还没开口，你先说：“今晚我们把话说开。”", "y": "AI 能给建议，谁来为结果负责，仍然是人。你下了决定就扛到底，这正是 AI 替代不了的那一份责任。"}, "DH": {"h": "比起开长会，更习惯先做一版看看，对错一目了然，决定也就有了。", "w": "比起开会争论，你先做一版摆上桌，对错一目了然，决定也就有了。习惯不等安排，自己先动手改变现状的人，任务表现略好（Zhang 等, 2022）。", "l": "新方法你不先问靠不靠谱，先按它做一次，做完就知道要不要继续。", "r": "想换个布置，你当天就搬，不满意再搬回来，比想半个月快得多。长期犹豫不决的人，往往也更容易焦虑、情绪起伏大，和情绪稳不稳联系最紧（Di Fabio 等, 2013）。所以定了就不回头，本身就是本事。", "q": "TA 犹豫要不要买，你说“先试个最小的”，试完两个人都知道答案了。", "y": "AI 能分析利弊，先做一版看看，往往比分析更快有结论。你下决定后马上动手，能把“想清楚再做”变成“做着做着就清楚”。"}, "DI": {"h": "下决定前会安静几秒，先问自己图的是什么，然后很快定下来。", "w": "别人在讨论听谁的，你安静了几秒，先想清楚自己图的是什么，然后说出来。出于自己想做而做的人，表现平均更好，要求质量的任务里更明显（Cerasoli 等, 2014）。", "l": "别人劝你考个热门证书，你算了算自己要去的地方，说了句“用不上”，就没报。", "r": "你很快知道今天想放松还是想充电，不被推荐带着走。长期犹豫不决的人，往往也更容易焦虑、情绪起伏大，和情绪稳不稳联系最紧（Di Fabio 等, 2013）。所以定了就不回头，本身就是本事。", "q": "TA 问“你到底想不想去”，你说：“我想。”答得很清楚。", "y": "AI 容易被热门带着走，你清楚自己图的是什么，也敢很快做出选择。众人都往一个方向涌的时候，这种独立判断最值钱。"}, "EF": {"h": "先听出对方话里压着的那层顾虑，再用他听得进去的方式把话递回去。", "w": "写给客户的话，你先听出他真正担心的是什么，再用他听得进去的方式递过去。在助人类工作里，共情高的人更不容易被工作掏空心力，也不容易对服务对象变得麻木、爱答不理，成就感还更高（Martingano 等, 2026）。", "l": "有人嘴上说没事，你看出他其实卡着，私下问一句，再帮他跟大家说一声。", "r": "朋友之间有点小芥蒂，你一句玩笑，把两边的台阶都搭好了。", "q": "TA 说“我没事”，你听出语气里还压着半句话，再轻轻回一句。能读准伴侣心情的人，感情满意度平均略高（Sened 等, 2017）。", "y": "AI 能写出得体的话，真正说到对方心里，要先听出没说的意思。人们更愿意和人打交道，你懂人又会说，让对方觉得“他懂我”。"}, "EG": {"h": "听过的难处你会记着，过几天还会主动问一句“后来怎么样了”。", "w": "同事扛不住的时候，你接过一部分，还记得第二天问一句“今天好点没”。在助人类工作里，共情高的人更不容易被工作掏空心力，也不容易对服务对象变得麻木、爱答不理，成就感还更高（Martingano 等, 2026）。", "l": "一起备考的人想放弃，你没劝，只是每天照常约他，最后两个人都走到了考场。毅力，也就是长期咬住目标不放，对成绩有帮助（Credé 等, 2017）。", "r": "朋友随口说过的难处你会记着，过阵子还主动问一句“后来怎么样了”。", "q": "TA 难过时你不讲大道理，只是陪着，第二天该做的事你也都替 TA 做了。能读准伴侣心情的人，感情满意度平均略高（Sened 等, 2017）。", "y": "AI 不会记得别人上周说的难处，更不会回头问一句。你听到并记着，会跟进到事情解决，让人觉得被当回事。"}, "EH": {"h": "表达关心不靠说，而是顺手做一点具体的事，比如记得对方不吃什么。", "w": "听出同事扛不住，你没说安慰的话，直接把他手上最烦的那块活接了过来。在助人类工作里，共情高的人更不容易被工作掏空心力，也不容易对服务对象变得麻木、爱答不理，成就感还更高（Martingano 等, 2026）。", "l": "同学听不懂，你画个例子给他，比讲十遍都管用。", "r": "你记得每个朋友的口味，聚会上那盘菜是照着最挑的那位做的。", "q": "TA 生病了，你话不多，但药、粥、挂号都安排好了。能读准伴侣心情的人，感情满意度平均略高（Sened 等, 2017）。", "y": "AI 能说安慰的话，却没法顺手做一件小事，让人觉得被照顾。你的关心落到行动上，是 AI 给不了的那一种在场。"}, "EI": {"h": "很能感受别人的情绪，也分得清哪些是他的、哪些是你的，不会被淹没。", "w": "听完同事抱怨，你共情了，也清楚哪些是 TA 的事、哪些是你的。在助人类工作里，共情高的人更不容易被工作掏空心力，也不容易对服务对象变得麻木、爱答不理，成就感还更高（Martingano 等, 2026）。", "l": "你会帮同学，但不会为了帮忙把自己的进度拖垮。", "r": "一个人待着时你不觉得空，那是你把自己攒回来的时间。", "q": "TA 希望你一直在，你说得出自己需要一点独处，而且说得让 TA 不觉得被推开。能读准伴侣心情的人，感情满意度平均略高（Sened 等, 2017）。", "y": "AI 不会被情绪淹没，但也感受不到对方。你能感受别人又不被带走，可以长期陪在人身边，不容易累垮。"}, "FG": {"h": "把几个人拉到同一个方向后不会甩手，一路跟到做完，出问题先顶上。", "w": "你把几个人拉到一个方向后没甩手，一路跟到做完，出了问题第一个顶上。带得动人的你，社交和表达能力往往也很出众（Judge 等, 2002）。大模型的说服效果已经和真人差不多（Hölbling 等, 2025），让人愿意一起往前走才是你的优势。", "l": "你拉了几个人一起打卡背单词，到最后还在坚持的是你，谁掉队了你还去问一句。毅力，也就是长期咬住目标不放，对成绩有帮助（Credé 等, 2017）。", "r": "你组的局总能成，因为定下来之后，订位、提醒、收钱都是你在做。", "q": "TA 和你有分歧，你把话讲清楚，也把答应的修复做到了。", "y": "AI 能写沟通稿，把人拉到同一个方向并跟到落地，要被信任的人来做。现在大家最关心“谁来负责”，你正好是那个人。"}, "FH": {"h": "说服别人不靠讲道理，而是先做一个小样给对方看，看到实物，顾虑就少了。", "w": "说服别人你不讲道理，先做一个小样放到他面前，看到实物，顾虑少了一半。带得动人的你，社交和表达能力往往也很出众（Judge 等, 2002）。大模型的说服效果已经和真人差不多（Hölbling 等, 2025），让人愿意一起往前走才是你的优势。", "l": "讲不通的概念，你当场做个演示，大家立刻明白。", "r": "朋友说想学做某道菜，你直接做一次给他看，他回去就上手了。", "q": "TA 对你的提议不放心，你先做个小版本，TA 试过之后就答应了。", "y": "AI 能写很会说服的话，一个小样却比听十遍道理更有用。你说服人靠做出来给人看，这是 AI 的文字替代不了的。"}, "FI": {"h": "能让人跟着你走，却不靠压人，因为你每次开口都清楚自己图什么。", "w": "你让别人跟着你走，不靠压人，因为大家感觉得到你真的想要。带得动人的你，社交和表达能力往往也很出众（Judge 等, 2002）。大模型的说服效果已经和真人差不多（Hölbling 等, 2025），让人愿意一起往前走才是你的优势。", "l": "你不会为了合群去附和，但说清楚理由之后，反而是你那条被大家采纳。", "r": "别人叫你去凑热闹，你会直说“我今天不想去”，还不让气氛变僵。", "q": "有分歧时，TA 说“你怎么想”，你坦率说出口，而且让 TA 听得进去。", "y": "AI 能模仿说服的口气，让一屋子人真心跟着走的，是你自己那份想做。人们更愿意追随有真实想法的人，带队和做社群时最明显。"}, "GH": {"h": "别人还在讨论怎么做时，你已经做出第一版，并且改到真的能用。", "w": "别人还在讨论怎么做，你已经做出第一版，并且改到真的能用。习惯不等安排，自己先动手改变现状的人，任务表现略好（Zhang 等, 2022）。", "l": "你交的那一版是改了好几遍之后的，别人交的常常是第一遍。毅力，也就是长期咬住目标不放，对成绩有帮助（Credé 等, 2017）。", "r": "你答应要修的东西，周末真的修好了，还顺手把旁边那个也收拾了。", "q": "TA 家里的事你接下来就办完了，没让 TA 再催第二遍。", "y": "AI 能给出第一版，把它改到真的能用，需要有人亲手收尾。你肯做到最后一步，正是 AI 时代最缺的那种交付。"}, "GI": {"h": "答应的事一定做到，而且很少答应自己不在乎的事，所以你的“好”字有分量。", "w": "你很少答应自己不在乎的事，但答应了就做到底，所以你的“好”字有分量。出于自己想做而做的人，表现平均更好，要求质量的任务里更明显（Cerasoli 等, 2014）。", "l": "你的目标清单上只有几项，每一项都写着“为什么我要它”。毅力，也就是长期咬住目标不放，对成绩有帮助（Credé 等, 2017）。", "r": "别人劝你再拼一点，你照旧把周末留给自己定下的那件小事，一周不落。", "q": "TA 说“你真的会做吗”，你说：“我答应过的，就会做。”", "y": "AI 能完成很多任务，哪些值得做到底，要有人来选。你只答应自己在乎的事，又肯扛到底，适合需要长期投入的事。"}, "HI": {"h": "喜欢自己动手做出来，想亲眼看看“我想要的那个东西，到底能不能被做出来”。", "w": "你做东西不是为了给谁看，而是想看看“我想要的那个”到底能不能做出来。出于自己想做而做的人，表现平均更好，要求质量的任务里更明显（Cerasoli 等, 2014）。", "l": "你的项目文件夹里，有一个只给自己做的小东西，名字是“只为我”。", "r": "做到一半没人看好，你也没停，因为你想看的是自己能不能做成。", "q": "TA 想要的东西买不到，你说“那我做一个”，然后真的做了出来。", "y": "AI 能写代码和方案，“我想要的那个东西能不能做出来”，还要自己去试。你自己动手验证，是一个人也能做出东西的底气。"}};

function basicAxes(r){

function traitsBy(){
