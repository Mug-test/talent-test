#brand{display:flex;align-items:center;gap:10px;padding:6px 0 12px}#brand .nm{font-weight:800;letter-spacing:.06em;font-size:.95rem}#brand .tg{margin-left:auto;font-size:.68rem;letter-spacing:.16em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px}

/* 某一维度在各理论里对应哪些特质（由 FW 生成，保证页面前后一致）*/
function xl(k){return FW.map(f=>{
 const items=f.groups.flatMap(g=>(g.items||[]).filter(i=>i[1]===k).map(i=>i[0]));
 const axes=f.groups.filter(g=>g.d.includes(k)).map(g=>g.n);
 const s=items.length?items.join('、'):axes.join('、');return s?`${f.short}：${s}`:null}).filter(Boolean)}

const FW_=[1,.8,.6];
function match(r){
 const mean=r.order.reduce((s,k)=>s+r.raw[k],0)/N;
 const u=K.map(k=>r.raw[k]-mean);
 const un=Math.sqrt(u.reduce((s,x)=>s+x*x,0))||1;
 const sc=FIGS.map(f=>{const w=K.map(k=>{const i=f.top.indexOf(k);return i<0?0:FW_[i]});const wm=w.reduce((a,b)=>a+b,0)/N;const wc=w.map(x=>x-wm);
  const wn=Math.sqrt(wc.reduce((s,x)=>s+x*x,0));return{f,s:u.reduce((s,x,i)=>s+x*wc[i],0)/(un*wn)}}).sort((a,b)=>b.s-a.s);
 const f=sc[0].f,f2=sc[1].f;
 const share=f.top.filter(k=>r.rank[k]<4);
 const gap=f.top.filter(k=>r.rank[k]>=4).sort((a,b)=>r.rank[b]-r.rank[a])[0];
 const mine=r.order.slice(0,3).find(k=>!f.top.includes(k));
 let why=share.length?`你们的共同点：${share.map(k=>AB[k].n).join('、')}。`:`你们没有重合的最强项，像在整体轮廓：都不是“样样平均”，而是有自己偏的那几项。`;
 if(gap)why+=`TA 还多一手「${AB[gap].n}」，你这一项偏低，想补的话可以${AB[gap].up.replace(/。$/,'')}。`;
 if(mine)why+=`你多的一手是「${AB[mine].n}」。`;
 return{f,f2,why}
}
